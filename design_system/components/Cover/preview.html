<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aqui</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-1); color: var(--ink-1); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; }
  .model { fill: var(--model); }
  .solver { fill: var(--solver); }
  .ink { fill: var(--ink-1); }
  .cost { fill: var(--cost); }
  .team { fill: var(--team); }
  .blk { rx: var(--radius-2); }
  .chip { rx: var(--radius-1); }
  .ring { fill: none; stroke: var(--surface-1); stroke-width: var(--border-rule); }
  .here { fill: var(--solver); }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-serif); font-size: 120px; line-height: .9; font-weight: 500; font-variation-settings: 'opsz' 72; letter-spacing: -0.01em; color: var(--ink-1); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      model (azulejo cobalt) 192×272 slab bled off the top, the largest · ink-1 (limestone in dark, Atlantic ink in light) 128×208 bled off the right · solver (Pombaline ochre) 128×144 · cost 48×32 and team 32×32 kept small (they only ever mean spending and a human action) — about 36% of 960×288
  arrangement one tall cobalt slab with satellites, bottoms on one line space-8 above the edge, space-4 gutters
  pattern     a literal motif: four broken uncertainty rings cut out of the slab in surface-1 around the solver "here" point — the wordmark's tittle, "here, ± how sure"; radii space-6 multiples (24, 48, 72, 96), stroke border-rule, breaks from a dash pattern
  scales      sides in space-4 / space-16 multiples; gutters space-4; ring pitch space-6; corners radius-2 for blocks, radius-1 for the two small chips
-->
<rect class="model blk" x="16" y="-16" width="192" height="272" rx="4"/>
<rect class="solver blk" x="224" y="112" width="128" height="144" rx="4"/>
<rect class="ink blk" x="368" y="48" width="128" height="208" rx="4"/>
<rect class="cost chip" x="224" y="64" width="48" height="32" rx="2"/>
<rect class="team chip" x="288" y="64" width="32" height="32" rx="2"/>
<circle class="ring" cx="112" cy="132" r="24" stroke-dasharray="30 8" stroke-dashoffset="4"/>
<circle class="ring" cx="112" cy="132" r="48" stroke-dasharray="62 14" stroke-dashoffset="20"/>
<circle class="ring" cx="112" cy="132" r="72" stroke-dasharray="96 18" stroke-dashoffset="40"/>
<circle class="ring" cx="112" cy="132" r="94" stroke-dasharray="130 22" stroke-dashoffset="64"/>
<circle class="here" cx="112" cy="132" r="7"/>
</svg>
</div>
<div class="words">
<h1 class="name">Aqui</h1>
<p class="tag">Where in the world could here be?</p>
</div>
</div>
</body>
</html>
