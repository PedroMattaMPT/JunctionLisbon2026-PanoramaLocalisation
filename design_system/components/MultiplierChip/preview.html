<html lang="en">
<head>

<title>MultiplierChip — preview</title>
</head>
<body>
<div id="root"></div>
<script>
var A = window.Aqui, h = React.createElement, D = A.Docs, S = A.Samples;
var view = h(D.Page, null, h(D.Grid, { cols: 3 },
  h(D.Cell, { label: 'Untouched' }, h(A.MultiplierChip, { value: 1 })),
  h(D.Cell, { label: 'After an answer, history open' }, h(A.MultiplierChip, { value: 0.95, history: S.CASE_A.multiplierHistory, open: true })),
  h(D.Cell, { label: 'After an answer and a cue' }, h(A.MultiplierChip, { value: 0.76 }))));
ReactDOM.createRoot(document.getElementById('root')).render(view);
